[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-event-review"
version = "0.1.3"
description = "Bounded offline Linux audit transaction and candidate process evidence"
readme = "项目文档/README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["项目文档/LICENSE", "项目文档/NOTICE"]
authors = [{name = "dhtfish98"}]
dependencies = []

[project.scripts]
audit-event-review = "audit_event_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/audit-event-review" = ["项目文档/ORIGIN.md", "项目文档/DEFENSIVE_SCOPE.md", "项目文档/VALIDATION.md", "项目文档/SOURCE_AUDIT.json"]
